server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'" always;

	location /api/ {
		proxy_pass http://api:8000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /health {
		proxy_pass http://api:8000/health;
		proxy_set_header Host $host;
	}

	location = /ready {
		proxy_pass http://api:8000/ready;
		proxy_set_header Host $host;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}